# Builds a test stela.efi, and the Windows stela.exe that carries it, from a
# chosen repository and ref, on demand only. The jobs follow release.yml's
# app, efi and cli jobs; this file leaves release.yml untouched so the fork
# merges upstream without conflicts.
#
# Install on a stick with the stela.exe of the same build:
#   .\stela.exe update --efi stela.efi
name: build-test

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Source repository (owner/name)"
        required: true
        default: tylertms/Stela
      ref:
        description: "Branch, tag or commit to build"
        required: true
        default: v0.5.0
      app:
        description: "Embed Stela.app, as the release does"
        type: boolean
        default: true
      app_runner:
        # The release uses macos-26 (arm64), whose queue can drop jobs when
        # GitHub lacks capacity. Stela.app needs only Swift 5.9 and macOS 13,
        # and build.sh builds it for arm64 on either architecture.
        description: "macOS runner for Stela.app"
        type: choice
        options:
          - macos-15-intel
          - macos-15
          - macos-26
        default: macos-15-intel

permissions:
  contents: read

concurrency:
  group: build-test-${{ inputs.repository }}-${{ inputs.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  APP: guest/stela-app

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Record the commit
        id: source
        run: |
          commit="$(git rev-parse HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Source: ${{ inputs.repository }} @ ${{ inputs.ref }} = $commit" >> "$GITHUB_STEP_SUMMARY"

  app:
    needs: source
    if: inputs.app
    runs-on: ${{ inputs.app_runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false

      - name: Build Stela.app
        env:
          STELA_APP_ARCH: arm64
        run: |
          swift --version
          app="$(bash "$APP/build.sh" | tee /dev/stderr | tail -1)"
          [[ -f "$app/Contents/Info.plist" ]] || { echo "::error::$APP/build.sh named no app bundle: $app"; exit 1; }
          lipo "$app/Contents/MacOS/Stela" -verify_arch arm64 || { echo "::error::Stela.app is not arm64"; exit 1; }
          echo "Stela.app built on ${{ inputs.app_runner }} ($(uname -m)), $(swift --version 2>&1 | head -1)" >> "$GITHUB_STEP_SUMMARY"
          tar -C "$(dirname "$app")" -cf Stela.app.tar Stela.app

      - uses: actions/upload-artifact@v4
        with:
          name: stela-app
          path: Stela.app.tar
          if-no-files-found: error
          retention-days: 3

  efi:
    needs: [source, app]
    # Runs without the app when it was not asked for, never after its failure.
    if: ${{ !cancelled() && needs.source.result == 'success' && (needs.app.result == 'success' || needs.app.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false

      - name: Install Clang 21 and the GPU host tools
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            clang-21 lld-21 llvm-21 llvm-21-dev libclang-21-dev libclang-cpp21-dev \
            glslang-tools ninja-build
          echo /usr/lib/llvm-21/bin >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-efi-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'crates/stela-boot/Cargo.lock') }}
          restore-keys: cargo-efi-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Install Rust
        run: |
          rustup toolchain install
          rustc --version
          version="$(clang --version)"
          echo "${version%%$'\n'*}"
          [[ "$version" =~ version\ (2[1-9]|[3-9][0-9])\. ]] || { echo "::error::clang on PATH is older than 21"; exit 1; }

      - name: Cache keys
        id: keys
        run: |
          pins="$(git ls-tree HEAD third_party | sha256sum | cut -c1-16)"
          llvm="$(clang --version | head -1)"
          tools="$(printf '%s\n%s\n%s\n' "$llvm" "$(rustc --version)" "$(glslangValidator --version | head -1)" | sha256sum | cut -c1-16)"
          echo "nvk=$pins-$tools" >> "$GITHUB_OUTPUT"
          echo "llvm=$(echo "$llvm" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: .tools/gpu
          key: gpu-tools-${{ steps.keys.outputs.image }}-${{ hashFiles('xtask/src/gpu/toolchain.rs') }}

      - uses: actions/cache@v4
        id: spirv
        with:
          path: .tools/spirv
          key: spirv-${{ steps.keys.outputs.image }}-${{ steps.keys.outputs.llvm }}-${{ hashFiles('.github/spirv.sh') }}

      - name: SPIR-V libraries
        run: |
          if [[ "${{ steps.spirv.outputs.cache-hit }}" != true ]]; then
            bash .github/spirv.sh .tools/spirv
          fi
          echo "PKG_CONFIG_PATH=$PWD/.tools/spirv/lib/pkgconfig" >> "$GITHUB_ENV"

      # Mesa and LLVM compiled for stela.efi; only an exact key restores.
      - uses: actions/cache@v4
        id: nvk
        with:
          path: target/gpu
          key: nvk-${{ steps.keys.outputs.nvk }}-${{ hashFiles('xtask/src/gpu/**', 'crates/stela-driver-gpu/**', 'third_party/patches/**', 'third_party/*.sparse', '.github/spirv.sh') }}

      - uses: actions/download-artifact@v4
        if: inputs.app
        with:
          name: stela-app
          path: app

      - name: Unpack Stela.app
        if: inputs.app
        run: |
          tar -C app -xf app/Stela.app.tar
          echo "STELA_APP=$PWD/app/Stela.app" >> "$GITHUB_ENV"

      - name: Fetch upstream sources
        run: cargo xtask gpu fetch

      - name: Keep the restored Mesa and LLVM build current
        if: steps.nvk.outputs.cache-hit == 'true'
        run: |
          find third_party crates/stela-driver-gpu -path '*/.git' -prune -o -type f -print0 \
            | xargs -0 touch -h -d '2000-01-01T00:00:00Z'

      - name: Build stela.efi
        env:
          STELA_RELEASE: "1"
        run: |
          cargo xtask boot build --release
          echo "Vulkan drivers: $(paste -sd, target/gpu/nvk/vulkan-drivers)" >> "$GITHUB_STEP_SUMMARY"
          efi=target/boot/x86_64-unknown-uefi/release/stela-deploy.efi
          [[ "$(head -c 2 "$efi")" == MZ ]] || { echo "::error::$efi is not a PE image"; exit 1; }
          mkdir -p dist
          cp "$efi" dist/stela.efi
          { echo "stela.efi: $(stat -c %s dist/stela.efi) bytes"; echo "sha256 $(sha256sum dist/stela.efi | cut -d' ' -f1)"; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: stela-efi
          path: dist/stela.efi
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: [source, efi]
    if: ${{ !cancelled() && needs.efi.result == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      ARCHIVE: stela-test-windows-x86_64
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false

      - name: Put LLVM on PATH
        run: echo 'C:\Program Files\LLVM\bin' >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-cli-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-cli-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add x86_64-pc-windows-msvc
          rustc --version
          for tool in clang llvm-lib; do
            command -v "$tool" >/dev/null || { echo "::error::$tool is not on PATH"; exit 1; }
          done

      - uses: actions/download-artifact@v4
        with:
          name: stela-efi
          path: efi

      - name: Build stela.exe
        run: |
          export STELA_EFI="$PWD/efi/stela.efi"
          cargo build --release --locked -p stela-cli --target x86_64-pc-windows-msvc
          mkdir -p "$ARCHIVE"
          cp target/x86_64-pc-windows-msvc/release/stela.exe efi/stela.efi "$ARCHIVE/"
          cp -R LICENSE NOTICE LICENSES "$ARCHIVE/"

      - name: Check stela.exe
        run: |
          binary="$ARCHIVE/stela.exe"
          "$binary" --version
          python -c 'import sys; sys.exit(open(sys.argv[1], "rb").read() not in open(sys.argv[2], "rb").read())' efi/stela.efi "$binary" \
            || { echo "::error::$binary does not hold the stela.efi the efi job built"; exit 1; }
          "$binary" create --help >/dev/null
          {
            echo "$("$binary" --version), source ${{ inputs.repository }} @ ${{ needs.source.outputs.commit }}"
            echo "stela.exe: $(wc -c < "$binary") bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 14
